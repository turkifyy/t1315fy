<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>طبقة حاجزة متعددة الأبعاد - إصدار احترافي</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #12121c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }

        .tablet-frame {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 0;
            overflow: hidden;
            border: 4px solid #2e2e4a;
            background: #000;
            aspect-ratio: attr(data-width) / attr(data-height); /* fallback */
        }

        /* سنضبط الأبعاد عبر JS لضمان المطابقة التامة */
        .content-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
            pointer-events: auto;
            z-index: 10;
        }

        .transparent-overlay {
            position: absolute;
            border: 3px solid #ff3333;
            background-color: transparent;
            pointer-events: auto !important;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            box-shadow: 0 0 0 2px rgba(255, 60, 60, 0.25);
            z-index: 20;
            outline: none;
            display: none; /* ستتحكم JS في الإظهار */
            /* سيتم ضبط top, left, width, height ديناميكيًا */
        }

        .dimension-hint {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: rgba(15, 15, 30, 0.9);
            color: #ddd;
            padding: 14px 22px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 15px;
            border-left: 6px solid #ff5555;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            z-index: 999;
            pointer-events: none;
            font-weight: 500;
            line-height: 1.7;
        }

        /* تلميح الأبعاد سيختفي عند وجود تطابق */
        .dimension-hint.hidden {
            display: none;
        }

        /* شريط معلومات صغير يظهر البعد الحالي (اختياري) */
        .debug-info {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid #3a3a5a;
        }
    </style>
</head>
<body>

    <div class="dimension-hint" id="dimensionHint">
        ⚠️ اضبط نافذة المتصفح على أحد الأبعاد المدعومة (انظر القائمة).<br>
        👉 استخدم وضع <strong>Responsive Design</strong> في أدوات المطور (F12).
    </div>

    <div class="debug-info" id="debugInfo">-- × --</div>

    <div class="tablet-frame" id="tabletFrame">
        <iframe
            class="content-iframe"
            src="https://gemioli.com/relicrunway/"
            title="Relic Runway - Gemioli"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy">
        </iframe>

        <div class="transparent-overlay" id="overlayEl" aria-hidden="true"></div>
    </div>

    <script>
        (function() {
            "use strict";

            const overlay = document.getElementById('overlayEl');
            const hint = document.getElementById('dimensionHint');
            const debugInfo = document.getElementById('debugInfo');
            const frame = document.getElementById('tabletFrame');

            // ─────────────────────────────────────────────────────────
            // خريطة الأبعاد المدعومة مع إعدادات الطبقة (نسب مئوية)
            // المفتاح: "العرض×الارتفاع"
            // القيمة: كائن { top, left, width, height }
            // ─────────────────────────────────────────────────────────
            const dimensionMap = new Map([
                // المجموعة الأولى (هواتف ذكية)
                ['390x844',  { top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['430x932',  { top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['360x780',  { top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1179x2556',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1320x2868',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1080x2340',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1220x2712',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1260x2800',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1260x2844',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1440x3168',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],
                ['1440x3200',{ top: '65.2%', left: '33.5%', width: '33.0%', height: '5.7%' }],

                // 375x667
                ['375x667',  { top: '69.7%', left: '36.0%', width: '28.0%', height: '5.3%' }],

                // 744x1133
                ['744x1133', { top: '73.1%', left: '35.0%', width: '30.5%', height: '5.0%' }],

                // 800x1280 (الإعداد الأول)
                ['800x1280', { top: '72.2%', left: '35.0%', width: '29.5%', height: '4.9%' }],

                // 820x1180 (تابلت)
                ['820x1180', { top: '75.0%', left: '35.5%', width: '29.0%', height: '5.9%' }],

                // 820x1180 (هواتف ذكية) - مكرر لكن بإعداد مختلف، سنحتفظ بالأول فقط
                // لكن المستخدم طلب إعدادين لنفس البعد، سندعم فقط الأخير أو ننشئ قاعدة خاصة
                // سنقوم بدمجها: نستخدم قيمة الهاتف عندما يكون العرض 820 والارتفاع 1180
                // لكن لا يمكن التمييز، سنستخدم الإعداد الأول (التابلت) إلا إذا أردت التفريق عبر userAgent (غير دقيق)
                // لحل ذلك، سنستخدم خريطة منفصلة للأبعاد المكررة بناءً على نسبة العرض إلى الارتفاع أو نعتمد على ترتيب الإدخال.
                // لتبسيط الأمر، سأستخدم القيمة الأولى المدرجة (التابلت). يمكن تعديلها حسب الرغبة.

                // 800x1280 (الإعداد الثاني) - لن نضيفه لأنه نفس المفتاح

                // 834x1194
                ['834x1194', { top: '74.4%', left: '36.0%', width: '28.5%', height: '6.3%' }],

                // التلفزيونات (16:9)
                ['1920x1080', { top: '75.9%', left: '39.5%', width: '20.0%', height: '9.8%' }],
                ['3840x2160', { top: '75.9%', left: '39.5%', width: '20.0%', height: '9.8%' }],
                ['1280x720',  { top: '75.9%', left: '39.5%', width: '20.0%', height: '9.8%' }],

                // 360x584
                ['360x584',  { top: '70.2%', left: '33.5%', width: '33.0%', height: '7.1%' }],

                // 800x1108
                ['800x1108', { top: '73.4%', left: '33.5%', width: '33.0%', height: '8.2%' }]
            ]);

            // قائمة إضافية للبعد 800x1280 بالإعداد الثاني (يجب معالجته بشكل خاص)
            // سنضيفه بمفتاح مميز "800x1280_alt" ونطبقه عند الحاجة إذا أردنا التبديل
            // لكن حسب الطلب ربما يكون خطأ. سنلتزم بالخريطة أعلاه.

            // دالة تحديث مظهر الطبقة بناءً على الأبعاد الحالية
            function applyOverlayForDimension(width, height) {
                const key = `${width}x${height}`;
                const config = dimensionMap.get(key);

                if (config) {
                    // تطبيق القيم
                    overlay.style.top = config.top;
                    overlay.style.left = config.left;
                    overlay.style.width = config.width;
                    overlay.style.height = config.height;
                    overlay.style.display = 'block';
                    hint.classList.add('hidden');
                    debugInfo.textContent = `${width}×${height} ✓ مطابق`;
                    debugInfo.style.color = '#0f0';
                } else {
                    // إخفاء الطبقة إذا لم يكن البعد مدعومًا
                    overlay.style.display = 'none';
                    hint.classList.remove('hidden');
                    debugInfo.textContent = `${width}×${height} ✗ غير مدعوم`;
                    debugInfo.style.color = '#ff8888';
                }

                // ضبط إطار الحاوية ليطابق النسبة (اختياري)
                frame.style.aspectRatio = `${width} / ${height}`;
            }

            // ─────────────────────────────────────────────────────────
            // آلية حظر الأحداث (نفس السابق)
            // ─────────────────────────────────────────────────────────
            const BLOCKED_EVENTS = [
                'click', 'dblclick', 'mousedown', 'mouseup', 'mousemove',
                'mouseenter', 'mouseleave', 'mouseover', 'mouseout',
                'touchstart', 'touchend', 'touchmove', 'touchcancel',
                'pointerdown', 'pointerup', 'pointermove', 'pointercancel',
                'contextmenu', 'selectstart', 'dragstart', 'drop',
                'keydown', 'keyup', 'keypress', 'focus'
            ];

            function blockAllEvents(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                if (e.cancelable) e.preventDefault();
                // للـ focus
                if (e.type === 'focus') overlay.blur();
            }

            BLOCKED_EVENTS.forEach(eventName => {
                overlay.addEventListener(eventName, blockAllEvents, {
                    capture: true,
                    passive: false
                });
            });

            // تأكيد إضافي
            overlay.addEventListener('focus', (e) => {
                e.preventDefault();
                overlay.blur();
            }, { capture: true });

            // دالة احتياطية لضبط pointer-events
            function enforceBlocker() {
                overlay.style.setProperty('pointer-events', 'auto', 'important');
                overlay.setAttribute('tabindex', '-1');
            }

            // تحديث عند تغيير الحجم
            function onResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                applyOverlayForDimension(w, h);
                enforceBlocker();
            }

            // مراقب الطفرات
            const observer = new MutationObserver(() => enforceBlocker());
            observer.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });

            // بدء التشغيل
            window.addEventListener('resize', onResize);
            onResize(); // التشغيل الأولي

            // معالجة خاصة للبعد 820x1180 إذا أردت التمييز بين هاتف/تابلت (اختياري)
            // يمكن استخدام userAgent أو نسبة الجهاز ولكن غير دقيق، لذا نعتمد على ما هو مدخل.

            // لوحة تحكم صغيرة (يمكن إزالتها)
            // عرض معلومات إضافية عند الضغط على مفتاح D (للمطور)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'd' || e.key === 'D') {
                    console.log('الأبعاد المدعومة:', Array.from(dimensionMap.keys()));
                }
            });

        })();
    </script>
</body>
</html>
