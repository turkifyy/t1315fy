<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>طبقة حاجزة - 360x584</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #12121c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }

        .tablet-frame {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 0;
            overflow: hidden;
            border: 4px solid #2e2e4a;
            background: #000;
        }

        .content-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
            pointer-events: auto;
            z-index: 10;
        }

        .transparent-overlay {
            position: absolute;
            border: 3px solid #ff3333;
            background-color: transparent;
            pointer-events: auto !important;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            box-shadow: 0 0 0 2px rgba(255, 60, 60, 0.25);
            z-index: 20;
            outline: none;
            display: none;
            top: 68.8%;
            left: 31.5%;
            width: 35.5%;
            height: 8.5%;
        }

        /* رسالة التوجيه - تظهر في الأعلى فقط عند عدم التطابق */
        .dimension-hint {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(15, 15, 30, 0.95);
            color: #eee;
            padding: 14px 28px;
            border-radius: 60px;
            backdrop-filter: blur(12px);
            font-size: 16px;
            border: 1px solid rgba(255, 85, 85, 0.3);
            border-left: 6px solid #ff5555;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.7), 0 0 0 1px rgba(255, 255, 255, 0.05) inset;
            z-index: 999;
            pointer-events: none;
            font-weight: 500;
            line-height: 1.6;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 0.3px;
            transition: opacity 0.25s ease, transform 0.25s ease;
        }

        .dimension-hint.hidden {
            opacity: 0;
            transform: translateX(-50%) translateY(-20px);
            pointer-events: none;
        }

        /* شريط الحالة - الآن عملاق وواضح جداً في الأعلى */
        .debug-info {
            position: fixed;
            top: 100px;              /* أسفل رسالة التوجيه مباشرة */
            left: 50%;
            transform: translateX(-50%);
            background: #0b0b12;      /* خلفية صلبة داكنة بدون شفافية */
            color: #ffffff;
            padding: 22px 48px;
            border-radius: 80px;
            font-family: 'Segoe UI', 'Arial Black', system-ui, sans-serif;
            font-size: 42px;          /* حجم خط كبير جداً */
            font-weight: 900;         /* سميك للغاية */
            z-index: 1000;
            pointer-events: none;
            border: 4px solid #5a5a7a;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.9), 0 0 0 2px #2a2a40 inset;
            text-align: center;
            white-space: nowrap;
            letter-spacing: 2px;
            text-transform: uppercase;
            transition: color 0.2s, border-color 0.2s;
        }

        /* تحسينات للشاشات المتوسطة والصغيرة */
        @media (max-width: 800px) {
            .debug-info {
                font-size: 32px;
                padding: 18px 36px;
                top: 120px;
                white-space: nowrap;
            }
        }

        @media (max-width: 550px) {
            .debug-info {
                font-size: 24px;
                padding: 16px 28px;
                top: 130px;
                border-width: 3px;
            }
            .dimension-hint {
                font-size: 13px;
                padding: 12px 16px;
                white-space: normal;
                max-width: 90%;
            }
        }

        /* للشاشات الصغيرة جداً */
        @media (max-width: 400px) {
            .debug-info {
                font-size: 20px;
                padding: 14px 22px;
                top: 120px;
            }
        }
    </style>
</head>
<body>

    <div class="dimension-hint" id="dimensionHint">
        ⚠️ اضبط نافذة المتصفح على البُعد <strong>360×584</strong> لتفعيل الطبقة الحاجزة.<br>
        👉 استخدم وضع <strong>Responsive Design</strong> في أدوات المطور (F12).
    </div>

    <div class="debug-info" id="debugInfo">-- × --</div>

    <div class="tablet-frame" id="tabletFrame">
        <iframe
            class="content-iframe"
            src="https://gemioli.com/relicrunway/"
            title="Relic Runway - Gemioli"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy">
        </iframe>

        <div class="transparent-overlay" id="overlayEl" aria-hidden="true"></div>
    </div>

    <script>
        (function() {
            "use strict";

            const overlay = document.getElementById('overlayEl');
            const hint = document.getElementById('dimensionHint');
            const debugInfo = document.getElementById('debugInfo');
            const frame = document.getElementById('tabletFrame');

            // ─────────────────────────────────────────────────────────
            // الجهاز المدعوم الوحيد: 360x584
            // ─────────────────────────────────────────────────────────
            const dimensionMap = new Map([
                ['360x584', { top: '68.8%', left: '31.5%', width: '35.5%', height: '8.5%' }]
            ]);

            function applyOverlayForDimension(width, height) {
                const key = `${width}x${height}`;
                const config = dimensionMap.get(key);

                if (config) {
                    overlay.style.top = config.top;
                    overlay.style.left = config.left;
                    overlay.style.width = config.width;
                    overlay.style.height = config.height;
                    overlay.style.display = 'block';
                    hint.classList.add('hidden');
                    debugInfo.innerHTML = `✅ ${width} × ${height}  <span style="font-size:0.7em;">(مطابق)</span>`;
                    debugInfo.style.color = '#b0ffb0';
                    debugInfo.style.borderColor = '#4caf50';
                } else {
                    overlay.style.display = 'none';
                    hint.classList.remove('hidden');
                    debugInfo.innerHTML = `❌ ${width} × ${height}  <span style="font-size:0.7em;">(غير مدعوم)</span>`;
                    debugInfo.style.color = '#ffb0b0';
                    debugInfo.style.borderColor = '#f44336';
                }

                frame.style.aspectRatio = `${width} / ${height}`;
            }

            const BLOCKED_EVENTS = [
                'click', 'dblclick', 'mousedown', 'mouseup', 'mousemove',
                'mouseenter', 'mouseleave', 'mouseover', 'mouseout',
                'touchstart', 'touchend', 'touchmove', 'touchcancel',
                'pointerdown', 'pointerup', 'pointermove', 'pointercancel',
                'contextmenu', 'selectstart', 'dragstart', 'drop',
                'keydown', 'keyup', 'keypress', 'focus'
            ];

            function blockAllEvents(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                if (e.cancelable) e.preventDefault();
                if (e.type === 'focus') overlay.blur();
            }

            BLOCKED_EVENTS.forEach(eventName => {
                overlay.addEventListener(eventName, blockAllEvents, {
                    capture: true,
                    passive: false
                });
            });

            overlay.addEventListener('focus', (e) => {
                e.preventDefault();
                overlay.blur();
            }, { capture: true });

            function enforceBlocker() {
                overlay.style.setProperty('pointer-events', 'auto', 'important');
                overlay.setAttribute('tabindex', '-1');
            }

            function onResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                applyOverlayForDimension(w, h);
                enforceBlocker();
            }

            const observer = new MutationObserver(() => enforceBlocker());
            observer.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });

            window.addEventListener('resize', onResize);
            onResize();

            window.addEventListener('keydown', (e) => {
                if (e.key === 'd' || e.key === 'D') {
                    console.log('البُعد المدعوم حالياً: 360x584');
                }
            });

        })();
    </script>
</body>
</html>
