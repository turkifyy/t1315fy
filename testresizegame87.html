<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>طبقة حاجزة - 360x760</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #12121c;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: system-ui, sans-serif;
        }

        .tablet-frame {
            position: relative;
            width: 100%;
            height: 100vh;
            max-width: 100%;
            max-height: 100vh;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
            border-radius: 0;
            overflow: hidden;
            border: 4px solid #2e2e4a;
            background: #000;
        }

        .content-iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
            display: block;
            background: white;
            pointer-events: auto;
            z-index: 10;
        }

        .transparent-overlay {
            position: absolute;
            border: 3px solid #ff3333;
            background-color: transparent;
            pointer-events: auto !important;
            touch-action: none;
            user-select: none;
            -webkit-user-select: none;
            cursor: default;
            box-shadow: 0 0 0 2px rgba(255, 60, 60, 0.25);
            z-index: 20;
            outline: none;
            display: none;
            top: 70.1%;
            left: 33.0%;
            width: 35.5%;
            height: 8.5%;
        }

        .dimension-hint {
            position: fixed;
            bottom: 25px;
            left: 25px;
            background: rgba(15, 15, 30, 0.9);
            color: #ddd;
            padding: 14px 22px;
            border-radius: 50px;
            backdrop-filter: blur(10px);
            font-size: 15px;
            border-left: 6px solid #ff5555;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
            z-index: 999;
            pointer-events: none;
            font-weight: 500;
            line-height: 1.7;
        }

        .dimension-hint.hidden {
            display: none;
        }

        .debug-info {
            position: fixed;
            bottom: 25px;
            right: 25px;
            background: rgba(0,0,0,0.7);
            color: #0f0;
            padding: 8px 16px;
            border-radius: 20px;
            font-family: monospace;
            font-size: 14px;
            z-index: 1000;
            pointer-events: none;
            backdrop-filter: blur(4px);
            border: 1px solid #3a3a5a;
        }
    </style>
</head>
<body>

    <div class="dimension-hint" id="dimensionHint">
        ⚠️ اضبط نافذة المتصفح على البُعد <strong>360×760</strong> لتفعيل الطبقة الحاجزة.<br>
        👉 استخدم وضع <strong>Responsive Design</strong> في أدوات المطور (F12).
    </div>

    <div class="debug-info" id="debugInfo">-- × --</div>

    <div class="tablet-frame" id="tabletFrame">
        <iframe
            class="content-iframe"
            src="https://gemioli.com/relicrunway/"
            title="Relic Runway - Gemioli"
            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture"
            allowfullscreen
            loading="lazy">
        </iframe>

        <div class="transparent-overlay" id="overlayEl" aria-hidden="true"></div>
    </div>

    <script>
        (function() {
            "use strict";

            const overlay = document.getElementById('overlayEl');
            const hint = document.getElementById('dimensionHint');
            const debugInfo = document.getElementById('debugInfo');
            const frame = document.getElementById('tabletFrame');

            // ─────────────────────────────────────────────────────────
            // خريطة الأبعاد المدعومة - الآن فقط 360x760
            // ─────────────────────────────────────────────────────────
            const dimensionMap = new Map([
                ['360x760', { top: '70.1%', left: '33.0%', width: '35.5%', height: '8.5%' }]
            ]);

            // دالة تحديث مظهر الطبقة بناءً على الأبعاد الحالية
            function applyOverlayForDimension(width, height) {
                const key = `${width}x${height}`;
                const config = dimensionMap.get(key);

                if (config) {
                    overlay.style.top = config.top;
                    overlay.style.left = config.left;
                    overlay.style.width = config.width;
                    overlay.style.height = config.height;
                    overlay.style.display = 'block';
                    hint.classList.add('hidden');
                    debugInfo.textContent = `${width}×${height} ✓ مطابق`;
                    debugInfo.style.color = '#0f0';
                } else {
                    overlay.style.display = 'none';
                    hint.classList.remove('hidden');
                    debugInfo.textContent = `${width}×${height} ✗ غير مدعوم`;
                    debugInfo.style.color = '#ff8888';
                }

                frame.style.aspectRatio = `${width} / ${height}`;
            }

            // ─────────────────────────────────────────────────────────
            // آلية حظر الأحداث على الطبقة الشفافة
            // ─────────────────────────────────────────────────────────
            const BLOCKED_EVENTS = [
                'click', 'dblclick', 'mousedown', 'mouseup', 'mousemove',
                'mouseenter', 'mouseleave', 'mouseover', 'mouseout',
                'touchstart', 'touchend', 'touchmove', 'touchcancel',
                'pointerdown', 'pointerup', 'pointermove', 'pointercancel',
                'contextmenu', 'selectstart', 'dragstart', 'drop',
                'keydown', 'keyup', 'keypress', 'focus'
            ];

            function blockAllEvents(e) {
                e.preventDefault();
                e.stopPropagation();
                e.stopImmediatePropagation();
                if (e.cancelable) e.preventDefault();
                if (e.type === 'focus') overlay.blur();
            }

            BLOCKED_EVENTS.forEach(eventName => {
                overlay.addEventListener(eventName, blockAllEvents, {
                    capture: true,
                    passive: false
                });
            });

            overlay.addEventListener('focus', (e) => {
                e.preventDefault();
                overlay.blur();
            }, { capture: true });

            function enforceBlocker() {
                overlay.style.setProperty('pointer-events', 'auto', 'important');
                overlay.setAttribute('tabindex', '-1');
            }

            // تحديث عند تغيير الحجم
            function onResize() {
                const w = window.innerWidth;
                const h = window.innerHeight;
                applyOverlayForDimension(w, h);
                enforceBlocker();
            }

            // مراقب الطفرات لضمان استمرار الخاصية
            const observer = new MutationObserver(() => enforceBlocker());
            observer.observe(overlay, { attributes: true, attributeFilter: ['style', 'class'] });

            // بدء التشغيل
            window.addEventListener('resize', onResize);
            onResize();

            // اختصار لعرض البُعد المدعوم في وحدة التحكم (للمطور)
            window.addEventListener('keydown', (e) => {
                if (e.key === 'd' || e.key === 'D') {
                    console.log('البُعد المدعوم: 360x760');
                }
            });

        })();
    </script>
</body>
</html>
